<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Lushi Tab</title>
<style>
:root{--ac:#ff8a1f;--bg:#0f1317;--pan:#1b2026;--pan2:#252b33;--ln:#343b45;--tx:#eef1f4;--mu:#9aa4b1;--ok:#3ccf7a;--bad:#ff5b5b;--fs:14px;--tb:46px}
:root.light{--pan:#f4f5f7;--pan2:#e7eaee;--ln:#cfd5dc;--tx:#1d232a;--mu:#5d6773}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:var(--fs) system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html.mouse,html.mouse *{cursor:none!important}
input,textarea,select,button{font:inherit;color:inherit}
textarea,input[type=text],input[type=number],input[type=search],input:not([type]){user-select:text;-webkit-user-select:text}
button{cursor:pointer}
#desk{position:fixed;inset:0 0 var(--tb) 0;background:var(--wall);background-size:cover;overflow:hidden}
#icons{position:absolute;left:8px;top:8px;bottom:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.di{width:86px;padding:6px 2px;border-radius:8px;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);border:1px solid transparent}
.di:hover{background:rgba(255,255,255,.12)}.di.sel{background:rgba(255,138,31,.28);border-color:rgba(255,138,31,.6)}
.di .ic,.sm .ic,.tbw .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 auto 4px;border-radius:12px;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.di span{font-size:12px;display:block;line-height:1.2}
#clockw{position:absolute;right:22px;top:18px;text-align:right;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
#clockw .t{font-size:58px;font-weight:300;letter-spacing:-1px}#clockw .d{font-size:16px;opacity:.9}#clockw .w{font-size:13px;opacity:.85;margin-top:4px}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(16,19,23,.94);backdrop-filter:blur(10px);border-top:1px solid #2a3038;display:flex;align-items:center;gap:4px;padding:0 6px;z-index:9000;color:#eef1f4}
#bStart{width:42px;height:36px;border-radius:8px;border:0;background:var(--ac);color:#111;font-weight:900;font-size:18px}
#bStart.on{box-shadow:0 0 0 2px #fff inset}
#pins{display:flex;gap:3px;padding-right:6px;margin-right:2px;border-right:1px solid #333a43}.pin{position:relative;width:40px;height:36px;border-radius:8px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center}.pin:hover{background:rgba(255,255,255,.1)}.pin .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}.pin.run::after{content:'';position:absolute;bottom:1px;left:12px;right:12px;height:3px;border-radius:2px;background:var(--ac)}#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
.tk{max-width:170px;min-width:42px;height:36px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.06);color:#eef1f4;display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;font-size:12.5px}
.tk.on{background:rgba(255,138,31,.22);border-color:rgba(255,138,31,.6)}.tk.min{opacity:.55}
.tray{display:flex;align-items:center;gap:6px;font-size:12px;color:#d9dee4}
.tray button{background:rgba(255,255,255,.07);border:1px solid #333a43;border-radius:7px;padding:4px 8px;color:#eef1f4;font-weight:700;font-size:12px}
#tclock{text-align:right;line-height:1.15;padding:0 4px;min-width:64px;border-radius:6px}#tclock:hover{background:rgba(255,255,255,.08)}
#start{position:fixed;left:6px;bottom:calc(var(--tb) + 6px);width:min(560px,calc(100vw - 12px));max-height:calc(100vh - var(--tb) - 14px);background:rgba(27,32,38,.97);border:1px solid #39414b;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:9500;display:none;flex-direction:column;color:#eef1f4;overflow:hidden}
#start.on{display:flex}
#start .top{padding:14px 14px 8px;display:flex;gap:10px;align-items:center}
#start .av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
#sq{flex:1;background:#12161b;border:1px solid #39414b;border-radius:10px;padding:9px 12px;color:#eef1f4}
#sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:6px 12px 12px;overflow:auto}
.sm{border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;border:1px solid transparent;background:none;color:#eef1f4}
.sm:hover,.sm.kb{background:rgba(255,255,255,.08);border-color:#444c57}
#start h6{font-size:11px;color:#9aa4b1;margin:4px 14px 0;text-transform:uppercase;letter-spacing:.5px;grid-column:1/-1}
#start .bot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #333a43;background:rgba(0,0,0,.2)}
#start .bot button{flex:1;background:#252b33;border:1px solid #39414b;border-radius:9px;padding:8px;color:#eef1f4}
.win{position:absolute;min-width:260px;min-height:170px;background:var(--pan);border:1px solid var(--ln);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.win.act{border-color:var(--ac);box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,138,31,.35)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.hid{display:none}
.wt{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;background:var(--pan2);border-bottom:1px solid var(--ln);touch-action:none}
.wt .ti{flex:1;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt button{width:34px;height:28px;border:0;border-radius:6px;background:none;font-size:15px;color:var(--tx)}
.wt button:hover{background:rgba(127,127,127,.25)}.wt button.x:hover{background:#d93b3b;color:#fff}
.wb{flex:1;overflow:auto;padding:10px;user-select:text;-webkit-user-select:text}
.wr{position:absolute;right:0;bottom:0;width:18px;height:18px;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(127,127,127,.5) 50%)}
#snap{position:absolute;background:rgba(255,138,31,.18);border:2px solid rgba(255,138,31,.7);border-radius:10px;display:none;pointer-events:none;z-index:8999}
#ctx{position:fixed;z-index:9800;background:rgba(27,32,38,.98);border:1px solid #3a424d;border-radius:10px;padding:4px;min-width:200px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.55);color:#eef1f4}
#ctx button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;color:#eef1f4;font-size:13px}#ctx button:hover{background:rgba(255,138,31,.2)}#ctx hr{border:0;border-top:1px solid #3a424d;margin:4px}
#cur{position:fixed;left:0;top:0;z-index:99999;pointer-events:none;display:none;will-change:transform}
html.mouse #cur{display:block}
.btn{background:var(--pan2);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;color:var(--tx)}.btn.p{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}.btn.d{color:var(--bad)}
.btn:hover{filter:brightness(1.12)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.inp{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;color:var(--tx);min-width:0}
:root.light .inp{background:#fff}
.note{font-size:12px;color:var(--mu);line-height:1.45}
h4{margin:10px 0 6px;color:var(--ac);font-size:13px}
table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:13px}th{color:var(--mu);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc button{height:52px;border-radius:10px;border:1px solid var(--ln);background:var(--pan2);font-size:19px;color:var(--tx)}.calc .o{background:#33281c;color:var(--ac)}.calc .eq{background:var(--ac);color:#111;font-weight:800}
.cdisp{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;text-align:right;margin-bottom:8px}.cdisp .h{color:var(--mu);font-size:12px;min-height:16px}.cdisp .v{font-size:32px;font-weight:300;word-break:break-all}
.nlist{width:190px;flex:none;border-right:1px solid var(--ln);overflow:auto}.nlist div{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:13px}.nlist div.on{background:rgba(255,138,31,.16)}
.ned{flex:1;display:flex;flex-direction:column;min-width:0}.ned textarea{flex:1;resize:none;border:0;outline:0;background:var(--bg);padding:12px;line-height:1.5;font-size:15px}
:root.light .ned textarea{background:#fff}
.accbar{display:flex;gap:3px;flex-wrap:wrap;padding:4px 6px;border-top:1px solid var(--ln);background:var(--pan2)}.accbar button{min-width:30px;height:28px;border-radius:6px;border:1px solid var(--ln);background:var(--pan);color:var(--tx)}
.osk{display:flex;flex-direction:column;gap:5px}.osk .r{display:flex;gap:5px;justify-content:center}.osk button{flex:1;min-width:0;height:46px;border-radius:8px;border:1px solid var(--ln);background:var(--pan2);font-size:17px;color:var(--tx)}.osk button.w2{flex:1.6}.osk button.sp{flex:6}.osk button.on{background:var(--ac);color:#111}
.kbd{display:inline-block;border:1px solid var(--ln);border-bottom-width:3px;border-radius:5px;padding:1px 6px;font-size:12px;background:var(--pan2);margin:1px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--pan2);padding:7px 12px;color:var(--tx)}.seg button.on{background:var(--ac);color:#111;font-weight:700}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.walls button{height:56px;border-radius:9px;border:2px solid transparent}.walls button.on{border-color:var(--ac)}
iframe{border:0;width:100%;height:100%;background:#fff}
.lock{position:fixed;inset:0;z-index:99990;background:var(--wall);background-size:cover;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}.lock.on{display:flex}.lock .t{font-size:84px;font-weight:200}.lock .d{font-size:20px}.lock .h{margin-top:30px;opacity:.8;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--tb) + 14px);transform:translateX(-50%);background:rgba(20,23,27,.95);color:#fff;border:1px solid #3a424d;border-radius:10px;padding:8px 14px;font-size:13px;z-index:99000;display:none;max-width:90vw}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal div{padding:6px 0;border-radius:6px;font-size:13px}.cal .h{color:var(--mu);font-size:11px}.cal .td{background:var(--ac);color:#111;font-weight:800}
.chip{display:inline-block;background:var(--pan2);border:1px solid var(--ln);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px}
@media (max-width:640px){#clockw .t{font-size:40px}.nlist{width:120px}}
</style>
</head>
<body>
<div id="desk"><div id="icons"></div><div id="clockw"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div><div class="w" id="cw"></div></div><div id="snap"></div></div>
<div id="bar">
 <button id="bStart" title="Démarrer (touche Windows ou Ctrl+Échap)">L</button>
 <div id="pins"></div><div id="tasks"></div>
 <div class="tray"><button id="bKb" title="Disposition du clavier (Alt+Maj pour changer)">FR</button><span id="tnet" title="Internet">●</span><span id="tbat"></span><div id="tclock"><div id="tt">--:--</div><div id="td" style="font-size:11px;opacity:.8"></div></div></div>
</div>
<div id="start"><div class="top"><div class="av" id="sav">M</div><input id="sq" placeholder="Rechercher une appli…" autocomplete="off"></div><div id="sgrid"></div>
 <div class="bot"><button id="sSet">⚙ Paramètres</button><button id="sLock">🔒 Verrouiller</button><button id="sFull">⛶ Plein écran</button></div></div>
<div id="ctx"></div>
<div class="lock" id="lock"><div class="t" id="lt"></div><div class="d" id="ld"></div><div class="h">Clique, touche ou appuie sur une touche pour ouvrir</div></div>
<div id="toast"></div>
<svg id="cur" width="20" height="20" viewBox="0 0 20 20"></svg>
<script>
'use strict';
/* ================== stockage ================== */
var KEY='lushitab_v1';
var D={name:'Michel',wall:0,theme:'dark',fs:14,layout:'auto',ptr:'petit',pcol:'blanc',dbl:400,osk:false,notes:[],rates:{USD:1,CDF:2850,ZMW:26.5,TZS:2650,ZAR:18.4,EUR:0.92},spread:1.5,caisse:[],apps:null,winpos:{},pins:['kalamu','plan']};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv)for(var k in sv)D[k]=sv[k];}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('Mémoire pleine : exporte tes données (Paramètres)');}}
var $=function(s,r){return (r||document).querySelector(s);},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t,ms){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},ms||2600);}
function fmtN(v,d){if(!isFinite(v))return '—';return Number(v).toLocaleString('fr-FR',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?2:d});}
var CAP=function(){try{return window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?(window.Capacitor.Plugins||{}):null;}catch(e){return null;}};

/* ================== fonds d'écran & thème ================== */
var WALLS=['linear-gradient(135deg,#0f2027,#203a43 50%,#2c5364)','linear-gradient(135deg,#1f1c2c,#928dab)','linear-gradient(135deg,#232526,#414345)','linear-gradient(135deg,#0b486b,#f56217)','linear-gradient(135deg,#134e5e,#71b280)','linear-gradient(135deg,#3a1c71,#d76d77 60%,#ffaf7b)','linear-gradient(160deg,#141e30,#243b55)','radial-gradient(circle at 30% 20%,#ff8a1f 0,#7a2e00 35%,#120c08 75%)'];
function applyLook(){document.documentElement.style.setProperty('--wall',WALLS[D.wall]||WALLS[0]);document.documentElement.classList.toggle('light',D.theme==='light');document.documentElement.style.setProperty('--fs',(D.fs||14)+'px');$('#sav').textContent=(D.name||'M').charAt(0).toUpperCase();ptrShape();}

/* ================== pointeur de souris petit et précis ================== */
var PSZ={mini:12,petit:16,moyen:22,grand:30},PCOL={blanc:['#fff','#000'],noir:['#111','#fff'],orange:['#ff8a1f','#111'],jaune:['#ffe14d','#111']};
var CUR={x:-50,y:-50,shape:'arrow',raf:0};
function ptrShape(){var s=PSZ[D.ptr]||16,c=PCOL[D.pcol]||PCOL.blanc,svg=$('#cur');svg.setAttribute('width',s);svg.setAttribute('height',s);
 var p={arrow:'<path d="M2 1.5v15.5l4.2-4 2.7 6 2.6-1.1-2.6-6h5.9z" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="1.3" stroke-linejoin="round"/>',
  hand:'<path d="M7 1.8c1 0 1.7.7 1.7 1.7v5.4l1-.2c.9-.1 1.7.4 1.9 1.2l.1.4 1-.2c.9-.1 1.7.4 1.9 1.3l.1.3.6-.1c1 0 1.8.7 1.8 1.7v2.8c0 2.2-1.8 4-4 4h-2.6c-1.3 0-2.6-.6-3.4-1.6l-3.3-4.2c-.6-.8-.4-1.9.4-2.4.7-.5 1.6-.4 2.2.2l.7.7V3.5c0-1 .8-1.7 1.8-1.7z" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="1.2"/>',
  text:'<path d="M7 2h6M7 18h6M10 2v16" stroke="'+c[1]+'" stroke-width="3" stroke-linecap="round"/><path d="M7 2h6M7 18h6M10 2v16" stroke="'+c[0]+'" stroke-width="1.4" stroke-linecap="round"/>',
  move:'<path d="M10 1l3 3h-2v5h5V7l3 3-3 3v-2h-5v5h2l-3 3-3-3h2v-5H4v2l-3-3 3-3v2h5V4H7z" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="1"/>',
  resize:'<path d="M3 3h6L7 5l8 8 2-2v6h-6l2-2-8-8-2 2z" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="1"/>'}[CUR.shape];
 svg.innerHTML=p;CUR.off=CUR.shape==='arrow'?[1.5*s/20,1*s/20]:[s/2,s/2];}
function shapeFor(el){if(!el||!el.closest)return 'arrow';if(el.closest('.wr'))return 'resize';if(el.closest('.wt')&&!el.closest('button'))return 'move';if(el.closest('textarea,input[type=text],input[type=number],input[type=search],input:not([type])'))return 'text';if(el.closest('button,a,.di,.sm,.tk,.nlist div,select,label,[data-click]'))return 'hand';return 'arrow';}
function curMove(e){if(e.pointerType!=='mouse')return;if(!document.documentElement.classList.contains('mouse'))document.documentElement.classList.add('mouse');CUR.x=e.clientX;CUR.y=e.clientY;var sh=shapeFor(e.target);if(sh!==CUR.shape){CUR.shape=sh;ptrShape();}
 if(!CUR.raf)CUR.raf=requestAnimationFrame(function(){CUR.raf=0;$('#cur').style.transform='translate('+(CUR.x-CUR.off[0])+'px,'+(CUR.y-CUR.off[1])+'px)';});}
window.addEventListener('pointermove',curMove,{passive:true,capture:true});window.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')curMove(e);else document.documentElement.classList.remove('mouse');},{capture:true});
document.addEventListener('mouseleave',function(){$('#cur').style.transform='translate(-50px,-50px)';});

/* ================== dispositions de clavier ================== */
var LAYOUTS={
 auto:{n:'Système (comme Android)',s:'SYS'},
 fr:{n:'AZERTY — France',s:'FR',m:{Backquote:['²',''],Digit1:['&','1'],Digit2:['é','2','~'],Digit3:['"','3','#'],Digit4:["'",'4','{'],Digit5:['(','5','['],Digit6:['-','6','|'],Digit7:['è','7','`'],Digit8:['_','8','\\'],Digit9:['ç','9','^'],Digit0:['à','0','@'],Minus:[')','°',']'],Equal:['=','+','}'],
  KeyQ:['a','A'],KeyW:['z','Z'],KeyE:['e','E','€'],BracketLeft:['^','¨'],BracketRight:['$','£','¤'],KeyA:['q','Q'],Semicolon:['m','M'],Quote:['ù','%'],Backslash:['*','µ'],IntlBackslash:['<','>'],KeyZ:['w','W'],KeyM:[',','?'],Comma:[';','.'],Period:[':','/'],Slash:['!','§']}},
 be:{n:'AZERTY — Belgique',s:'BE',m:{Backquote:['²','³'],Digit1:['&','1','|'],Digit2:['é','2','@'],Digit3:['"','3','#'],Digit4:["'",'4'],Digit5:['(','5'],Digit6:['§','6','^'],Digit7:['è','7'],Digit8:['!','8'],Digit9:['ç','9','{'],Digit0:['à','0','}'],Minus:[')','°'],Equal:['-','_'],
  KeyQ:['a','A'],KeyW:['z','Z'],KeyE:['e','E','€'],BracketLeft:['^','¨','['],BracketRight:['$','*',']'],KeyA:['q','Q'],Semicolon:['m','M'],Quote:['ù','%','´'],Backslash:['µ','£','`'],IntlBackslash:['<','>','\\'],KeyZ:['w','W'],KeyM:[',','?'],Comma:[';','.'],Period:[':','/'],Slash:['=','+','~']}},
 us:{n:'QWERTY — US / anglais',s:'US',m:{}},
 intl:{n:'QWERTY — avec accents (AltGr)',s:'US+',m:{KeyE:['e','E','é'],KeyA:['a','A','à'],KeyQ:['q','Q','â'],KeyW:['w','W','è'],KeyR:['r','R','ê'],KeyU:['u','U','ù'],KeyI:['i','I','î'],KeyO:['o','O','ô'],KeyC:['c','C','ç'],KeyY:['y','Y','ë'],KeyT:['t','T','ï'],Digit5:['5','%','€']}},
 de:{n:'QWERTZ — Allemagne / Suisse',s:'DE',m:{KeyY:['z','Z'],KeyZ:['y','Y'],Semicolon:['ö','Ö'],Quote:['ä','Ä'],BracketLeft:['ü','Ü'],Minus:['ß','?','\\'],Digit2:['2','"','²'],Digit3:['3','§','³'],Digit6:['6','&'],Digit7:['7','/','{'],Digit8:['8','(','['],Digit9:['9',')',']'],Digit0:['0','=','}'],KeyQ:['q','Q','@'],KeyE:['e','E','€'],Comma:[',',';'],Period:['.',':'],Slash:['-','_'],BracketRight:['+','*','~']}}};
var LORD=['auto','fr','be','us','intl','de'];
